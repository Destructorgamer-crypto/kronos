<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pestanya nova</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/chromium/chromium/main/chrome/app/theme/default_100_percent/common/favicon_ntp.png">
    <style>
        :root {
            --accent: #ffffff;
            --bg: #000000;
            --panel: rgba(255, 255, 255, 0.05);
            --vpn: #ff4444;
            --emergency-red: #cc0000;
            --spotify-green: #1DB954;
            --text-color: #ffffff;
            --matrix-color: #ffffff;
            --border-color: #444; /* Color de borde para botones top */
        }

        /* ===== TEMAS ===== */
        /* Oscuro (predeterminado) */
        body.theme-dark {
            --bg: #000000; --panel: rgba(255,255,255,0.05);
            --text-color: #ffffff; --accent: #ffffff; --matrix-color: #ffffff;
            --border-color: #444;
        }
        /* Claro */
        body.theme-light {
            --bg: #ffffff; --panel: rgba(0,0,0,0.05);
            --text-color: #000000; --accent: #000000; --matrix-color: #000000;
            --border-color: #ccc;
        }
        /* Matrix (verde) */
        body.theme-green {
            --bg: #000000; --panel: rgba(0,255,65,0.06);
            --text-color: #00ff41; --accent: #00ff41; --matrix-color: #00ff41;
            --border-color: #0a3d1a;
        }
        /* Alerta (rojo) */
        body.theme-red {
            --bg: #000000; --panel: rgba(255,51,51,0.06);
            --text-color: #ff3b3b; --accent: #ff3b3b; --matrix-color: #ff3b3b;
            --border-color: #4d0000;
        }
        /* Cian */
        body.theme-cyan {
            --bg: #000000; --panel: rgba(0,229,255,0.06);
            --text-color: #00e5ff; --accent: #00e5ff; --matrix-color: #00e5ff;
            --border-color: #004d54;
        }
        /* Púrpura */
        body.theme-purple {
            --bg: #000000; --panel: rgba(185,103,255,0.06);
            --text-color: #bb66ff; --accent: #bb66ff; --matrix-color: #bb66ff;
            --border-color: #3d0a52;
        }
        /* Ámbar */
        body.theme-amber {
            --bg: #000000; --panel: rgba(255,176,0,0.06);
            --text-color: #ffb000; --accent: #ffb000; --matrix-color: #ffb000;
            --border-color: #4d3300;
        }

        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Segoe UI', Roboto, sans-serif; overflow: hidden; background: #fff; }
        
        /* --- INTERFAZ GOOGLE --- */
        #google-page { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 100; display: flex; flex-direction: column; transition: opacity 0.8s; }
        #g-top { display: flex; justify-content: flex-end; padding: 15px 20px; align-items: center; gap: 15px; font-size: 13px; color: #5f6368; }
        #g-main { flex: 1; display: flex; flex-direction: column; align-items: center; padding-top: 15vh; }
        #g-logo { width: 272px; margin-bottom: 30px; cursor: pointer; }

        #search-box {
            width: 680px; height: 52px; border: 1px solid #dfe1e5; border-radius: 26px;
            display: flex; align-items: center; padding: 0 14px 0 20px; transition: box-shadow 0.2s;
            margin-bottom: 25px; box-sizing: border-box; position: relative;
        }
        #search-box:hover { box-shadow: 0 1px 6px rgba(32,33,36,0.28); border-color: rgba(223,225,229,0); }
        
        #search-box > svg:first-of-type { width: 20px; height: 20px; margin-right: 12px; flex-shrink: 0; }
        #search-input { flex: 1; border: none; outline: none; font-size: 16px; padding-left: 0; background: transparent; }

        #photo-icons {
            display: flex; align-items: center; gap: 18px; flex-shrink: 0;
            position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
        }
        .g-icon-svg-tactical { height: 24px; width: 24px; cursor: pointer; display: block; }

        #g-shortcuts { display: flex; gap: 25px; margin-top: 5px; }
        .s-item { width: 88px; text-align: center; color: #3c4043; cursor: pointer; text-decoration: none; }
        .s-icon { width: 48px; height: 48px; background: #f1f3f4; border-radius: 50%; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; }
        .s-text { font-size: 12px; }

        #personalize-btn {
            position: fixed; bottom: 16px; right: 16px; display: flex; align-items: center; gap: 8px;
            padding: 8px 16px; border: 1px solid #dadce0; border-radius: 20px;
            font-size: 14px; color: #747775; cursor: pointer; background: #fff;
        }

        /* --- KRONOS KERNEL --- */
        #kronos-kernel { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 1000; color: var(--text-color); font-family: 'Courier New', monospace; overflow-y: auto; }
        #bin-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.30; z-index: -1; }
        
        /* Top Buttons Area */
        #top-buttons-container { position: fixed; top: 20px; left: 20px; display: flex; align-items: center; gap: 10px; z-index: 2000; }
        
        .top-btn {
            padding: 10px 15px; background: #191919; color: var(--text-color); border: 1px solid var(--border-color);
            font-size: 11px; cursor: pointer; letter-spacing: 2px; transition: all 0.2s; font-weight: bold;
            font-family: 'Courier New', monospace;
        }
        body.theme-light .top-btn { background: #eee; color: #000; }

        #emergency-btn:hover { background: var(--emergency-red); border-color: var(--emergency-red); color: #fff; }
        #chat-open-btn:hover { background: var(--accent); border-color: var(--accent); color: var(--bg); }
        
        #emergency-hint { font-size: 10px; color: #555; letter-spacing: 1px; margin-left: 5px; }

        #theme-toggle { position: fixed; top: 20px; right: 120px; z-index: 2000; }
        .theme-btn {
            padding: 8px 12px; background: #191919; color: var(--text-color); border: 1px solid var(--border-color);
            font-size: 10px; cursor: pointer; border-radius: 20px; font-weight: bold; font-family: 'Courier New', monospace;
            display: flex; align-items: center; gap: 6px;
        }
        body.theme-light .theme-btn { background: #eee; color: #000; }
        .theme-btn .swatch-dot {
            width: 10px; height: 10px; border-radius: 50%; background: var(--accent);
            box-shadow: 0 0 6px var(--accent); flex-shrink: 0;
        }

        /* Panel de personalización de temas */
        #theme-panel {
            position: fixed; top: 60px; right: 120px; z-index: 2500;
            background: #0a0a0a; border: 1px solid var(--border-color); border-radius: 8px;
            padding: 16px; width: 210px; display: none; flex-direction: column; gap: 10px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            font-family: 'Courier New', monospace;
        }
        body.theme-light #theme-panel { background: #fafafa; }
        #theme-panel.open { display: flex; }
        #theme-panel-title {
            font-size: 10px; letter-spacing: 2px; color: #888; margin-bottom: 4px;
        }
        .theme-option {
            display: flex; align-items: center; gap: 10px; padding: 8px 10px;
            border: 1px solid #262626; border-radius: 6px; cursor: pointer;
            background: #111; transition: all 0.15s; font-size: 11px; color: #ddd;
            letter-spacing: 1px;
        }
        body.theme-light .theme-option { background: #f0f0f0; color: #222; border-color: #ddd; }
        .theme-option:hover { border-color: var(--accent-preview, #666); transform: translateX(2px); }
        .theme-option.active { border-color: var(--accent-preview, #fff); box-shadow: 0 0 0 1px var(--accent-preview, #fff); }
        .theme-option .swatch {
            width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0;
            background: var(--sw-bg); border: 2px solid var(--sw-fg);
            box-shadow: 0 0 8px var(--sw-fg);
        }

        #spotify-top-wrap { position: fixed; top: 20px; right: 20px; z-index: 2000; }
        .spotify-btn {
            padding: 8px 20px; background: #111; color: #fff; border: 1px solid #333;
            font-size: 11px; cursor: pointer; letter-spacing: 1.5px; transition: all 0.3s; font-weight: bold; border-radius: 20px;
            text-decoration: none; display: inline-block; font-family: 'Courier New', monospace;
        }
        .spotify-btn:hover { background: var(--spotify-green); border-color: var(--spotify-green); color: #000; transform: scale(1.05); }

        #ui-wrap { width: 100%; display: flex; flex-direction: column; align-items: center; padding: 60px 0 140px 0; animation: fadeIn 1.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        #main-header { font-size: 80px; letter-spacing: 20px; text-shadow: 0 0 15px rgba(255,255,255,0.5); margin-bottom: 15px; }
        #ix-search { width: 450px; background: var(--panel); border: 1px solid #333; color: var(--text-color); padding: 15px; border-radius: 4px; outline: none; margin-bottom: 12px; text-align: center; font-size: 14px; }
        #ix-vpn-link { color: var(--text-color); font-size: 11px; text-decoration: none; margin-bottom: 50px; opacity: 0.6; letter-spacing: 1px; }

        #main-grid, #fav-grid { display: grid; width: 92%; max-width: 1400px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        .game-btn { background: var(--panel); border: 1px solid #222; color: var(--text-color); padding: 20px; cursor: pointer; font-size: 11px; font-weight: bold; display: flex; flex-direction: column; border-radius: 2px; text-align: left; transition: all 0.3s ease; }
        .game-btn:hover { background: var(--accent); color: var(--bg); transform: translateY(-3px); border-color: var(--accent); }
        .btn-top { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .vpn-tag { color: var(--vpn); font-size: 9px; margin-top: 8px; font-weight: 800; letter-spacing: 1px; }
        .fav-star { font-size: 18px; color: #444; }
        .fav-star.active { color: #ffeb3b !important; }
        .fav-section { border-bottom: 1px solid #222; padding-bottom: 30px; margin-bottom: 30px; width: 92%; display: none; }

        /* --- CHAT SIDEBAR SYSTEM --- */
        #chat-sidebar {
            position: fixed; right: -320px; top: 0; width: 300px; height: 100%;
            background: var(--bg); border-left: 1px solid #333; z-index: 3000;
            transition: right 0.4s cubic-bezier(0.19, 1, 0.22, 1);
            display: flex; flex-direction: column;
        }
        #chat-sidebar.open { right: 0; }
        
        #chat-auth { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 30px; gap: 10px; }
        #chat-auth input { background: #000; border: 1px solid #333; color: #fff; padding: 12px; font-family: inherit; font-size: 12px; outline: none; text-align: center; }
        #chat-auth input::placeholder { color: #555; }
        #chat-auth button { background: var(--accent); color: var(--bg); border: none; padding: 12px; font-weight: bold; cursor: pointer; font-family: inherit; letter-spacing: 1px; }
        
        #chat-main { flex: 1; display: none; flex-direction: column; overflow: hidden; }
        #chat-header { padding: 15px; font-size: 10px; color: #555; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        #chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; scrollbar-width: none; }
        #chat-messages::-webkit-scrollbar { display: none; }
        
        .msg { border-left: 1px solid #333; padding-left: 10px; animation: fadeIn 0.3s ease; }
        .msg-u { color: #555; font-size: 9px; display: block; margin-bottom: 4px; text-transform: uppercase; }
        .msg-t { color: var(--text-color); font-size: 12px; word-break: break-all; line-height: 1.4; }
        
        #chat-input-wrap { padding: 20px; border-top: 1px solid #333; background: var(--panel); }
        #chat-input { width: 100%; background: transparent; border: none; color: var(--text-color); font-family: inherit; outline: none; font-size: 12px; }

        #ix-footer { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--bg); border-top: 1px solid #222; padding: 18px 0; z-index: 1100; }
        #ix-footer-content { width: 95%; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--text-color); letter-spacing: 1.5px; font-weight: bold; }
        .footer-part { flex: 1; }
        #footer-left { text-align: left; }
        #footer-center { text-align: center; }
        #footer-right { text-align: right; }
    </style>
</head>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDHoFU5TiEq0LwsTUc04NifV57n1wDQAHg",
            authDomain: "indexumchat.firebaseapp.com",
            databaseURL: "https://indexumchat-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "indexumchat",
            storageBucket: "indexumchat.firebasestorage.app",
            messagingSenderId: "67069413036",
            appId: "1:67069413036:web:4725c1f35ae027a9d04109"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Global functions for module
        window.loginChat = () => {
            const user = document.getElementById('chat-user').value.trim();
            const pass = document.getElementById('chat-pass').value;
            if(user.length >= 3 && pass.length >= 4) {
                localStorage.setItem('ix_chat_user', user);
                checkChatSession();
            } else {
                alert("ERR: User > 2 chars, Pass > 3 chars.");
            }
        };

        window.logoutChat = () => {
            localStorage.removeItem('ix_chat_user');
            location.reload();
        };

        function checkChatSession() {
            const user = localStorage.getItem('ix_chat_user');
            if(user) {
                document.getElementById('chat-auth').style.display = 'none';
                document.getElementById('chat-main').style.display = 'flex';
                initChatLogic(user);
            }
        }

        function initChatLogic(user) {
            const input = document.getElementById('chat-input');
            const box = document.getElementById('chat-messages');
            
            input.onkeypress = (e) => {
                if(e.key === 'Enter' && input.value.trim()) {
                    push(ref(db, 'messages'), { u: user, t: input.value, s: serverTimestamp() });
                    input.value = '';
                }
            };

            onChildAdded(ref(db, 'messages'), (snap) => {
                const d = snap.val();
                const m = document.createElement('div');
                m.className = 'msg';
                m.innerHTML = `<span class="msg-u">${d.u}</span><span class="msg-t">${d.t}</span>`;
                box.appendChild(m);
                
                // Mantiene limpio borrando visualmente mensajes antiguos (>25)
                if(box.childNodes.length > 25) box.removeChild(box.firstChild);
                
                box.scrollTop = box.scrollHeight;
            });
        }
        checkChatSession();
    </script>

    <script>
        // Capa de seguridad
        window.unlockKernel = () => {
            document.getElementById('google-page').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('google-page').style.display = 'none';
                document.getElementById('kronos-kernel').style.display = 'block';
                initMatrix(); initFooter(); loadMenu();
            }, 600);
        };

        function toggleChat() { 
            document.getElementById('chat-sidebar').classList.toggle('open'); 
        }

        function triggerEmergency() { window.location.href = "https://classroom.google.com/"; }
        window.addEventListener('keydown', (e) => { if (e.key === "Control") triggerEmergency(); });

        const THEMES = ['dark', 'light', 'green', 'red', 'cyan', 'purple', 'amber'];

        function applyTheme(name) {
            if (!THEMES.includes(name)) name = 'dark';
            document.body.classList.remove(...THEMES.map(t => `theme-${t}`));
            document.body.classList.add(`theme-${name}`);
            document.querySelectorAll('.theme-option').forEach(el => {
                el.classList.toggle('active', el.dataset.theme === name);
            });
        }

        function setTheme(name) {
            applyTheme(name);
            localStorage.setItem('ix_theme', name);
            closeThemePanel();
        }

        function loadMenu(filter = "") {
            const mGrid = document.getElementById('main-grid'); const fGrid = document.getElementById('fav-grid');
            mGrid.innerHTML = ""; fGrid.innerHTML = "";
            const filtered = GAMES.filter(g => g.n.includes(filter.toUpperCase()));
            const favs = filtered.filter(g => favorites.includes(g.n));
            document.getElementById('sys-count').innerText = GAMES.length;
            if (favs.length > 0) { document.getElementById('fav-container').style.display = "block"; favs.forEach((g, i) => fGrid.appendChild(createCard(g, i))); }
            else { document.getElementById('fav-container').style.display = "none"; }
            filtered.forEach((g, i) => mGrid.appendChild(createCard(g, i)));
        }

        function createCard(g, i) {
            const card = document.createElement('div'); card.className = 'game-btn'; card.style.animationDelay = `${i * 0.03}s`;
            card.innerHTML = `<div class="btn-top"><span>${g.n}</span><span class="fav-star ${favorites.includes(g.n)?'active':''}" onclick="toggleFav('${g.n}', event)">★</span></div>${g.vpn ? '<div class="vpn-tag">VPN</div>' : ''}`;
            card.onclick = () => {
                let finalUrl = (g.u.length < 15 && !g.u.includes('.')) ? `https://turbowarp.org/${g.u}/embed?autoplay=1` : g.u;
                const win = window.open('about:blank');
                win.document.write(`<html><head><title>System Load</title></head><style>body,html{margin:0;padding:0;width:100vw;height:100vh;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center;}iframe{width:100%;height:100%;border:none;position:absolute;top:0;left:0;}</style><body><iframe src="${finalUrl}" allow="autoplay; fullscreen; keyboard" allowfullscreen></iframe></body></html>`);
            };
            return card;
        }

        function toggleFav(n, e) { e.stopPropagation(); favorites.includes(n) ? favorites = favorites.filter(f => f !== n) : favorites.push(n); localStorage.setItem('ix_favs', JSON.stringify(favorites)); loadMenu(document.getElementById('ix-search').value); }
        function initFooter() { setInterval(() => { document.getElementById('footer-center').innerText = new Date().toLocaleTimeString(); }, 1000); }
        function initMatrix() {
            const c = document.getElementById('bin-canvas'); const ctx = c.getContext('2d');
            c.width = window.innerWidth; c.height = window.innerHeight;
            const drops = Array(Math.floor(c.width / 20)).fill(1);
            ctx.font = "14px Courier New";
            setInterval(() => {
                ctx.fillStyle = document.body.classList.contains('theme-light') ? "rgba(255,255,255,0.05)" : "rgba(0,0,0,0.05)"; 
                ctx.fillRect(0,0,c.width,c.height);
                ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--matrix-color');
                drops.forEach((y, i) => {
                    ctx.fillText(Math.floor(Math.random()*2), i*20, y*14);
                    if(y*14 > c.height && Math.random() > 0.975) drops[i] = 0; drops[i]++;
                });
            }, 33);
        }
